<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CurrentGuard — Motor-current diagnostics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:    #f1ede4;
  --paper-2:  #e8e2d4;
  --ink:      #1a1612;
  --ink-2:    #3a342c;
  --ink-3:    #6b6258;
  --ink-4:    #9a9185;
  --rule:     rgba(26, 22, 18, 0.18);
  --rule-soft:rgba(26, 22, 18, 0.10);
  --surface:  #f8f5ed;
  --surface2: #ebe6d8;
  --accent:   #b8431f;
  --steel:    #2a4a6b;
  --gold:     #a87f2c;

  /* Dark-glass overrides for cinematic sections */
  --glass-bg:    rgba(20, 16, 12, 0.72);
  --glass-bg-2:  rgba(34, 28, 22, 0.78);
  --glass-rule:  rgba(241, 237, 228, 0.14);
  --glass-rule-2:rgba(241, 237, 228, 0.22);
  --glass-text:  #f1ede4;
  --glass-text-2:rgba(241, 237, 228, 0.78);
  --glass-text-3:rgba(241, 237, 228, 0.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: #0e0a06;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ───── Reusable form controls (light-on-dark for cinematic sections) ─── */
.form-group { display: flex; flex-direction: column; gap: 0.5rem; }
.form-label {
  font-size: 0.66rem;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--glass-text-3);
  font-weight: 500;
}
.form-input {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.92rem;
  padding: 0.7rem 0.95rem;
  background: rgba(241, 237, 228, 0.05);
  border: 1px solid var(--glass-rule);
  border-radius: 0;
  color: var(--glass-text);
  width: 100%;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.form-input:focus { border-color: var(--accent); background: rgba(184, 67, 31, 0.08); }
.form-hint {
  font-size: 0.74rem;
  color: var(--glass-text-3);
  font-family: 'Fraunces', serif;
  font-style: italic;
  line-height: 1.4;
}

/* Toggle */
.toggle-wrap { display: flex; align-items: center; gap: 0.7rem; }
.toggle {
  width: 38px; height: 20px;
  background: rgba(241, 237, 228, 0.12);
  border: 1px solid var(--glass-rule);
  position: relative;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s;
}
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle-knob {
  position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px;
  background: var(--paper);
  transition: left 0.18s;
}
.toggle.on .toggle-knob { left: 20px; }
.toggle-label { font-size: 0.84rem; color: var(--glass-text-2); font-family: 'Fraunces', serif; font-style: italic; }

/* Tag */
.tag {
  display: inline-flex; align-items: center;
  padding: 0.2rem 0.55rem;
  border: 1px solid currentColor;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  font-weight: 500;
  border-radius: 0;
  background: transparent;
}

/* Card chrome — used inside light scenes */
.card { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 2px; }
.card-header {
  padding: 0.85rem 1.1rem;
  border-bottom: 1px solid var(--rule-soft);
  display: flex; align-items: center; gap: 0.6rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.card-body { padding: 1.1rem 1.2rem; }
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 0.5rem;
}

/* ───── Cinematic page chrome ──────────────────────────────────────── */

.bg-stage {
  position: fixed; inset: 0; z-index: 0;
}

.scroll-stage {
  position: relative;
  z-index: 1;
}

/* Top fixed bar — minimal */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 2rem;
  pointer-events: none;
}
.top-bar > * { pointer-events: auto; }
.top-bar .brand {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 1rem;
  color: var(--paper);
  letter-spacing: 0.02em;
  mix-blend-mode: difference;
}
.top-bar .brand .ampersand { color: var(--accent); font-weight: 500; }
.top-bar .brand-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  color: rgba(241, 237, 228, 0.6);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-top: 0.18rem;
  mix-blend-mode: difference;
}

/* Right-side step rail */
.step-rail {
  position: fixed; right: 1.5rem; top: 50%;
  transform: translateY(-50%);
  z-index: 40;
  display: flex; flex-direction: column; gap: 1.4rem;
}
.step-rail-item {
  display: flex; align-items: center; gap: 0.75rem;
  cursor: pointer;
  text-decoration: none;
  color: rgba(241, 237, 228, 0.45);
  transition: color 0.2s;
}
.step-rail-item:hover { color: rgba(241, 237, 228, 0.9); }
.step-rail-item.active { color: var(--paper); }
.step-rail.light .step-rail-item { color: var(--ink-4); }
.step-rail.light .step-rail-item:hover { color: var(--ink-2); }
.step-rail.light .step-rail-item.active { color: var(--ink); }
.step-rail-num {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1rem;
  width: 1.4rem;
  text-align: right;
}
.step-rail-bar {
  width: 36px; height: 1px;
  background: currentColor;
  transition: width 0.25s;
}
.step-rail-item.active .step-rail-bar { width: 64px; background: var(--accent); }
.step-rail-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

/* Section base */
section.cinema {
  min-height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  padding: 6rem 0;
}

/* Hero / Upload */
.hero-wrap {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 4rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4rem;
  align-items: center;
}
.hero-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: rgba(241, 237, 228, 0.6);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 1.4rem;
  display: flex; align-items: center; gap: 0.6rem;
}
.hero-eyebrow::before {
  content: ''; width: 28px; height: 1px;
  background: var(--accent);
  display: inline-block;
}
.hero-title {
  font-family: 'Fraunces', serif;
  font-variation-settings: '"opsz" 144';
  font-weight: 300;
  font-size: clamp(3rem, 6vw, 5.4rem);
  color: var(--paper);
  line-height: 1;
  letter-spacing: -0.025em;
  margin-bottom: 1.6rem;
}
.hero-title em {
  font-style: italic;
  font-weight: 400;
  color: var(--accent);
}
.hero-lede {
  font-family: 'Fraunces', serif;
  font-size: 1.05rem;
  line-height: 1.7;
  color: rgba(241, 237, 228, 0.78);
  max-width: 32rem;
  margin-bottom: 2.4rem;
}
.hero-meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.4rem;
  padding-top: 1.4rem;
  border-top: 1px solid rgba(241, 237, 228, 0.18);
}
.hero-meta-item .k {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  color: rgba(241, 237, 228, 0.5);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 0.3rem;
}
.hero-meta-item .v {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1rem;
  color: var(--paper);
}

/* Upload panel — glass */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid var(--glass-rule);
  padding: 2rem;
}
.glass-panel-header {
  display: flex; align-items: baseline; justify-content: space-between;
  padding-bottom: 1.2rem;
  margin-bottom: 1.4rem;
  border-bottom: 1px solid var(--glass-rule);
}
.glass-panel-header h2 {
  font-family: 'Fraunces', serif;
  font-variation-settings: '"opsz" 144';
  font-weight: 400;
  font-size: 1.5rem;
  color: var(--paper);
  letter-spacing: -0.01em;
}
.glass-panel-header .step-roman {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 1.4rem;
  color: var(--accent);
}

/* Upload dropzone */
.dropzone {
  border: 1px dashed rgba(241, 237, 228, 0.3);
  background: rgba(241, 237, 228, 0.03);
  padding: 2.4rem 1.6rem;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.dropzone:hover, .dropzone.over {
  background: rgba(184, 67, 31, 0.08);
  border-color: var(--accent);
}
.dropzone-content {
  text-align: center;
}
.dropzone-icon-row {
  display: flex; justify-content: center; gap: 0.4rem;
  margin-bottom: 1rem;
  font-family: 'JetBrains Mono', monospace;
  color: rgba(241, 237, 228, 0.4);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
}
.dropzone-title {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1.2rem;
  color: var(--paper);
  margin-bottom: 0.4rem;
}
.dropzone-sub {
  font-size: 0.78rem;
  color: rgba(241, 237, 228, 0.5);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
}

.file-list {
  margin-top: 1.4rem;
  display: flex; flex-direction: column; gap: 0.5rem;
}
.file-row {
  display: grid;
  grid-template-columns: 16px 1fr auto auto;
  gap: 0.85rem;
  align-items: center;
  padding: 0.7rem 0.9rem;
  background: rgba(241, 237, 228, 0.04);
  border-left: 2px solid var(--accent);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.76rem;
  color: var(--glass-text-2);
}
.file-row .fname { color: var(--paper); }
.file-row .fsize { color: rgba(241, 237, 228, 0.45); }
.file-row .fclass {
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  padding: 0.15rem 0.45rem;
  border: 1px solid currentColor;
}

/* Configure section */
.cfg-grid {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 4rem;
}
.cfg-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 3rem;
}
.cfg-title {
  font-family: 'Fraunces', serif;
  font-variation-settings: '"opsz" 144';
  font-weight: 300;
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: var(--paper);
  line-height: 1;
  letter-spacing: -0.025em;
}
.cfg-title em { font-style: italic; color: var(--accent); }
.cfg-subtitle {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1rem;
  color: rgba(241, 237, 228, 0.6);
  text-align: right;
  max-width: 24rem;
}

.cfg-panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}
.cfg-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid var(--glass-rule);
  padding: 1.6rem 1.8rem;
}
.cfg-panel h3 {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 1.15rem;
  color: var(--paper);
  margin-bottom: 0.3rem;
}
.cfg-panel .h3-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
  color: var(--accent);
  letter-spacing: 0.18em;
  margin-bottom: 0.3rem;
  display: block;
}
.cfg-panel-divider { height: 1px; background: var(--glass-rule); margin: 1.2rem 0; }

/* Processing section */
.proc-wrap {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 4rem;
}
.proc-title {
  font-family: 'Fraunces', serif;
  font-variation-settings: '"opsz" 144';
  font-weight: 300;
  font-size: clamp(2.5rem, 5vw, 4rem);
  color: var(--paper);
  line-height: 1;
  letter-spacing: -0.025em;
  margin-bottom: 0.5rem;
}
.proc-title em { font-style: italic; color: var(--accent); }
.proc-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: rgba(241, 237, 228, 0.6);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 3rem;
}
.proc-status .dot {
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  margin-right: 0.6rem;
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.7); }
}
.proc-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 2rem;
}
.proc-stages {
  display: flex; flex-direction: column;
  gap: 1px;
  background: var(--glass-rule);
  border: 1px solid var(--glass-rule);
}
.proc-stage {
  background: var(--glass-bg);
  padding: 1.1rem 1.4rem;
  display: grid;
  grid-template-columns: 2.4rem 1fr auto;
  gap: 1rem;
  align-items: center;
}
.proc-stage-num {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1.1rem;
  color: var(--glass-text-3);
}
.proc-stage.active .proc-stage-num { color: var(--accent); }
.proc-stage-name {
  font-family: 'Fraunces', serif;
  font-size: 1rem;
  color: var(--paper);
}
.proc-stage-desc {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--glass-text-3);
  letter-spacing: 0.04em;
  margin-top: 0.2rem;
}
.proc-stage-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--accent);
  letter-spacing: 0.05em;
}

.proc-readout {
  background: var(--glass-bg-2);
  border: 1px solid var(--glass-rule);
  padding: 1.6rem 1.8rem;
  display: flex; flex-direction: column; gap: 1.2rem;
}
.proc-readout h3 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--glass-text-3);
  margin-bottom: 0.4rem;
}
.proc-readout .big-num {
  font-family: 'Fraunces', serif;
  font-variation-settings: '"opsz" 144';
  font-weight: 300;
  font-size: 3rem;
  color: var(--paper);
  line-height: 1;
}
.proc-readout .big-num span { font-size: 1.5rem; color: var(--glass-text-3); margin-left: 0.3rem; }

/* Results section — light paper */
section.cinema.results-section {
  background: transparent;
  color: var(--ink);
  padding: 8rem 0 6rem;
}
.results-wrap {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 4rem;
  position: relative;
}
.results-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--ink-3);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 1.2rem;
  display: flex; align-items: center; gap: 0.6rem;
}
.results-eyebrow::before {
  content: ''; width: 28px; height: 1px;
  background: var(--accent);
}
.results-title {
  font-family: 'Fraunces', serif;
  font-variation-settings: '"opsz" 144';
  font-weight: 300;
  font-size: clamp(3rem, 6vw, 5.4rem);
  line-height: 1;
  letter-spacing: -0.025em;
  margin-bottom: 0.6rem;
  color: var(--ink);
}
.results-title em { font-style: italic; color: var(--accent); }
.results-lede {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1.1rem;
  color: var(--ink-2);
  max-width: 36rem;
  margin-bottom: 3rem;
}

.results-headline-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
  margin-bottom: 3rem;
}

.results-section-block {
  margin-bottom: 4rem;
}
.results-block-header {
  display: flex; align-items: baseline; justify-content: space-between;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 0.8rem;
  margin-bottom: 1.6rem;
}
.results-block-header h3 {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 1.6rem;
  color: var(--ink);
}
.results-block-header .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  color: var(--ink-3);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* Buttons */
.btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.85rem 1.6rem;
  background: var(--accent);
  color: var(--paper);
  border: none;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  font-weight: 500;
}
.btn:hover { opacity: 0.85; }
.btn:active { transform: translateY(1px); }
.btn.ghost {
  background: transparent;
  color: var(--paper);
  border: 1px solid var(--glass-rule-2);
}
.btn.ghost:hover { background: rgba(241, 237, 228, 0.06); }
.btn.dark {
  background: var(--ink);
  color: var(--paper);
}
.btn-row { display: flex; gap: 0.8rem; margin-top: 1.6rem; }

/* Scroll hint */
.scroll-hint {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(241, 237, 228, 0.45);
  text-align: center;
}
.scroll-hint .arrow {
  display: block;
  margin-top: 0.5rem;
  font-size: 0.85rem;
  animation: bounce 1.6s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(6px); opacity: 1; }
}

/* Registration marks (corner) */
.reg-mark {
  position: fixed;
  width: 18px; height: 18px;
  pointer-events: none;
  z-index: 30;
}
.reg-mark::before, .reg-mark::after {
  content: '';
  position: absolute;
  background: rgba(120, 110, 100, 0.4);
  mix-blend-mode: difference;
}
.reg-mark::before { width: 100%; height: 1px; top: 50%; left: 0; }
.reg-mark::after  { width: 1px; height: 100%; left: 50%; top: 0; }
.reg-tl { top: 16px; left: 16px; }
.reg-tr { top: 16px; right: 16px; }
.reg-bl { bottom: 16px; left: 16px; }
.reg-br { bottom: 16px; right: 16px; }

@media (max-width: 900px) {
  .hero-wrap, .cfg-panels, .proc-grid, .results-headline-row { grid-template-columns: 1fr; gap: 2rem; }
  .step-rail { display: none; }
}
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
